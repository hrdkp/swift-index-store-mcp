name: Bug report
description: Something doesn't work or returns wrong results
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead. Include the tool call and its output if an agent made it.
    validations:
      required: true
  - type: textarea
    id: load-index
    attributes:
      label: loadIndex output
      description: The full text `loadIndex` returned. It names the index store and the libIndexStore that were used.
      render: text
  - type: input
    id: version
    attributes:
      label: index-store-mcp version
      description: Output of `index-store-mcp --version`
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `xcodebuild -version`, `xcode-select -p`, and `sw_vers -productVersion`, plus the Xcode version that last built the project.
      render: text
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: e.g. Claude Code 2.x, Cursor, Claude Desktop
