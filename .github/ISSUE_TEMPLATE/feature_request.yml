name: Feature request
description: Suggest a new tool or a change to an existing one
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What were you or your agent trying to find out, and why couldn't the current tools answer it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The tool or change you have in mind, if any.
